<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>modelo</title>
</head>
<body>
    <header id="title">
        <h1>Analisador de Números</h1>
    </header>

    <section>
        <div id="number">
            <label for="num">Digite um Número entre 1 e 100: </label>
            <input type="number" id="num" onkeypress="if(event.key === 'Enter') adicionar()">
            <input type="button" value="Adicionar" id="add" class="btn" onclick="adicionar()">
        </div>
        
        <div class="container">
            <div id="lista">
            
            </div>
            <div id="res">
            
            </div>
        </div>
        <input type="button" value="Finalizar" id="finalizar" class="btn" onclick="finalizar()">
    </section>
    <footer>
        <p>&copy; Henrique Ribeiro</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
